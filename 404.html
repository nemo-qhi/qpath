<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qpath</title>
    <script>
      const firstPath = window.location.pathname.split("/").filter(Boolean)[0];
      const basePath = firstPath ? `/${firstPath}/` : "/";
      window.location.replace(`${basePath}#home`);
    </script>
  </head>
  <body>
    qpathを開いています。
  </body>
</html>
